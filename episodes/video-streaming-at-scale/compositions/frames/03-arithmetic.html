<template>
  <style>
    @font-face { font-family: "Zen Maru Gothic"; src: url("assets/fonts/ZenMaru-700.woff2") format("woff2"); font-weight: 700; font-display: block; }
    @font-face { font-family: "Zen Maru Gothic"; src: url("assets/fonts/ZenMaru-900.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Zen Kaku Gothic New"; src: url("assets/fonts/ZenKaku-400.woff2") format("woff2"); font-weight: 400; font-display: block; }
    @font-face { font-family: "Zen Kaku Gothic New"; src: url("assets/fonts/ZenKaku-500.woff2") format("woff2"); font-weight: 500; font-display: block; }
    @font-face { font-family: "Zen Kaku Gothic New"; src: url("assets/fonts/ZenKaku-700.woff2") format("woff2"); font-weight: 700; font-display: block; }
    @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono-400.woff2") format("woff2"); font-weight: 400; font-display: block; }
    @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono-700.woff2") format("woff2"); font-weight: 700; font-display: block; }

    #root {
      position: relative; width: 1920px; height: 1080px; overflow: hidden; container-type: size;
      --paper: #F4EBD9; --paper-warm: #FBF6EA; --cloud: #FDFBF4;
      --ink: #3B2F2A; --ink-soft: #6B5A4E;
      --sky: #7FB4DC; --sky-deep: #2E5F8A;
      --meadow: #7FA653; --meadow-deep: #3F6B34;
      --terracotta: #C4552F; --terracotta-lit: #EE8557; --terracotta-ink: #9E4324;
      --night: #1E2A38; --night-mute: #A8BACB;
    }

    /* the continuity object — one real segment from the film's own manifest, pinned
       bottom-left. The id never moves; only the state word changes. */
    .seg-pill {
      position: absolute; left: 96px; bottom: 74px;
      display: flex; align-items: center; gap: 16px;
      padding: 13px 26px; border-radius: 999px;
      background: var(--paper-warm); box-shadow: 0 10px 30px rgba(59,47,42,0.22);
      font-family: "JetBrains Mono", monospace; font-size: 20px; color: var(--ink);
    }
    .seg-pill b { font-weight: 700; }
    .seg-pill i { display: block; width: 1px; height: 20px; background: rgba(59,47,42,0.22); }
    .seg-state { position: relative; display: inline-block; width: 186px; height: 24px; }
    .seg-state span {
      position: absolute; left: 0; top: 0; white-space: nowrap;
      font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
      font-size: 15px; line-height: 24px; color: var(--terracotta-ink);
    }

    .grain {
      position: absolute; inset: -50%; width: 200%; height: 200%; pointer-events: none;
      opacity: 0.055; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='170' height='170' filter='url(%23n)'/></svg>");
    }

    /* the paper register: the painted plate washed back so brushwork still reads
       through it (0.90 — never 1.0, or the paint stops being paint). */
    #f3-wind { position: absolute; inset: -14%; }
    #f3-plate { position: absolute; inset: 0; background: url("public/img/valley-dawn.jpg") center/cover no-repeat; }
    #f3-wash { position: absolute; inset: -14%; background: var(--paper); opacity: 0.84; }

    #f3-stage { position: absolute; inset: 0; }

    #f3-card {
      position: absolute; left: 210px; top: 168px; width: 1500px; height: 744px;
      border-radius: 14px; background: var(--paper-warm);
      border: 1px solid rgba(59,47,42,0.12);
      box-shadow: 0 26px 64px rgba(59,47,42,0.16);
    }

    #f3-kicker {
      position: absolute; left: 76px; top: 62px;
      font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 500;
      font-size: 41px; line-height: 1.4; color: var(--ink);
    }

    /* the two terms, side by side, then the resolve beneath a rule. Everything
       technical is mono with tabular figures so nothing reflows while it counts. */
    .f3-term { position: absolute; top: 190px; }
    .f3-fig {
      font-family: "JetBrains Mono", monospace; font-weight: 700;
      font-size: 104px; line-height: 1.0; letter-spacing: -0.01em; color: var(--ink);
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .f3-cap {
      margin-top: 18px; max-width: 470px;
      font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 400;
      font-size: 21px; line-height: 1.5; color: var(--ink-soft);
    }
    #f3-t1 { left: 76px; }
    #f3-times {
      position: absolute; left: 636px; top: 206px;
      font-family: "JetBrains Mono", monospace; font-weight: 400;
      font-size: 76px; line-height: 1; color: var(--ink-soft);
    }
    #f3-t2 { left: 750px; }

    #f3-rule {
      position: absolute; left: 76px; top: 452px; width: 1348px; height: 2px;
      background: var(--terracotta); transform-origin: 0% 50%;
    }

    /* the resolve. terracotta measures 3.78:1 on paper — display sizes only, which
       this is, at 118px. Its caption below is ink, not terracotta. */
    #f3-res {
      position: absolute; left: 76px; top: 500px;
      font-family: "JetBrains Mono", monospace; font-weight: 700;
      font-size: 118px; line-height: 1.0; letter-spacing: -0.01em;
      color: var(--terracotta); font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    #f3-kick2 {
      position: absolute; left: 76px; top: 636px;
      font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 500;
      font-size: 41px; line-height: 1.3; color: var(--ink); white-space: nowrap;
    }
    .f3-w { display: inline-block; }
  </style>

  <div id="root" data-composition-id="03-arithmetic" data-width="1920" data-height="1080">
    <div id="f3-clip" class="clip" data-start="0" data-duration="11.5" data-track-index="0" data-layout-allow-overflow>
      <div id="f3-stage">
        <div id="f3-wind"><div id="f3-plate"></div></div>
        <div id="f3-wash"></div>

        <div id="f3-card">
          <div id="f3-kicker">Do the arithmetic.</div>

          <div id="f3-t1" class="f3-term">
            <div class="f3-fig">15 Mbps</div>
            <div class="f3-cap">one Ultra HD stream<br>Netflix, recommended connection speed</div>
          </div>
          <div id="f3-times">&times;</div>
          <div id="f3-t2" class="f3-term">
            <div class="f3-fig" id="f3-count">0</div>
            <div class="f3-cap">people, pressing play<br>inside the same second</div>
          </div>

          <div id="f3-rule"></div>
          <div id="f3-res">= 15 Tbps</div>
          <div id="f3-kick2"><span class="f3-w">No</span> <span class="f3-w">origin</span> <span class="f3-w">serves</span> <span class="f3-w">that.</span></div>
        </div>

        <div class="grain"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });

      // ---- SEAM 2 -> 3 ENTRY: cut-the-curve LEFT. Frame 02 exited at -238 on power4.in;
      // this enters from +302 on power4.out. The card carries the motion and is at full
      // opacity from t=0 — the frame rides its own cut rather than fading up behind it.
      tl.fromTo("#f3-card", { x: 302 }, { x: 0, duration: 0.43, ease: "power4.out" }, 0);

      tl.fromTo("#f3-wind", { xPercent: 0.7 }, { xPercent: -0.8, duration: 11.5, ease: "none" }, 0);

      // Scene 2 (2.2-5.4s): the first term.
      tl.fromTo("#f3-t1", { autoAlpha: 0, y: 26 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.3);

      // Scene 3 (5.4-7.6s): the multiplication sign, then the count. Six digits resolving
      // in 0.9s — a running system, and the reason the figure is tabular.
      tl.fromTo("#f3-times", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.34, ease: "back.out(2)" }, 3.3);
      tl.fromTo("#f3-t2", { autoAlpha: 0, y: 26 }, { autoAlpha: 1, y: 0, duration: 0.44, ease: "power3.out" }, 3.55);
      var counter = { v: 0 };
      tl.to(counter, {
        v: 1000000, duration: 3.3, ease: "power1.out",
        onUpdate: function () {
          document.getElementById("f3-count").textContent =
            Math.round(counter.v).toLocaleString("en-US");
        }
      }, 3.8);

      // Scene 4 (7.6-9.9s): the rule draws, then 0.4s of stillness, then the resolve.
      // That held beat is the cheapest emphasis in the kit and this is where it belongs.
      tl.fromTo("#f3-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.66, ease: "power3.inOut" }, 7.4);
      tl.fromTo("#f3-res", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.52, ease: "power3.out" }, 8.6);

      // Scene 5 (9.9-11.5s): the consequence lands word by word. NOT a character type-on:
      // `width` and `clip-path` are not animatable here, and a scaleX reveal squashes the
      // glyphs rather than uncovering them. A staged word arrival is the honest version of
      // the same beat and it is seek-safe.
      tl.fromTo(".f3-w", { autoAlpha: 0, y: 20 },
                { autoAlpha: 1, y: 0, duration: 0.34, ease: "power3.out", stagger: 0.13 }, 9.9);

      // ---- SEAM 3 -> 4: INVERSE ZOOM (z -1). The ARRIVAL vector, spent once in the film,
      // here, because this is where the thesis lands: the film you assumed was sent is not.
      // Both sides share the scale-velocity sign — this side pulls BACK (scale down) and
      // frame 4 enters from BELOW 1.0 and grows, so the eye reads one continuous rush.
      tl.to("#f3-stage", { scale: 0.86, autoAlpha: 0.0, duration: 0.36, ease: "power4.in" }, 11.14);

      window.__timelines = window.__timelines || {};
      window.__timelines["03-arithmetic"] = tl;
    })();
  </script>
</template>

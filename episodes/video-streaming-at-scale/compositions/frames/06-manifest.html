<template>
  <style>
    @font-face { font-family: "Zen Maru Gothic"; src: url("assets/fonts/ZenMaru-700.woff2") format("woff2"); font-weight: 700; font-display: block; }
    @font-face { font-family: "Zen Maru Gothic"; src: url("assets/fonts/ZenMaru-900.woff2") format("woff2"); font-weight: 900; font-display: block; }
    @font-face { font-family: "Zen Kaku Gothic New"; src: url("assets/fonts/ZenKaku-400.woff2") format("woff2"); font-weight: 400; font-display: block; }
    @font-face { font-family: "Zen Kaku Gothic New"; src: url("assets/fonts/ZenKaku-500.woff2") format("woff2"); font-weight: 500; font-display: block; }
    @font-face { font-family: "Zen Kaku Gothic New"; src: url("assets/fonts/ZenKaku-700.woff2") format("woff2"); font-weight: 700; font-display: block; }
    @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono-400.woff2") format("woff2"); font-weight: 400; font-display: block; }
    @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono-700.woff2") format("woff2"); font-weight: 700; font-display: block; }

    #root {
      position: relative; width: 1920px; height: 1080px; overflow: hidden; container-type: size;
      --paper: #F4EBD9; --paper-warm: #FBF6EA; --cloud: #FDFBF4;
      --ink: #3B2F2A; --ink-soft: #6B5A4E;
      --sky: #7FB4DC; --sky-deep: #2E5F8A;
      --meadow: #7FA653; --meadow-deep: #3F6B34;
      --terracotta: #C4552F; --terracotta-lit: #EE8557; --terracotta-ink: #9E4324;
      --night: #1E2A38; --night-mute: #A8BACB;
    }

    /* the continuity object — one real segment from the film's own manifest, pinned
       bottom-left. The id never moves; only the state word changes. */
    .seg-pill {
      position: absolute; left: 96px; bottom: 74px;
      display: flex; align-items: center; gap: 16px;
      padding: 13px 26px; border-radius: 999px;
      background: var(--paper-warm); box-shadow: 0 10px 30px rgba(59,47,42,0.22);
      font-family: "JetBrains Mono", monospace; font-size: 20px; color: var(--ink);
    }
    .seg-pill b { font-weight: 700; }
    .seg-pill i { display: block; width: 1px; height: 20px; background: rgba(59,47,42,0.22); }
    .seg-state { position: relative; display: inline-block; width: 186px; height: 24px; }
    .seg-state span {
      position: absolute; left: 0; top: 0; white-space: nowrap;
      font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
      font-size: 15px; line-height: 24px; color: var(--terracotta-ink);
    }

    .grain {
      position: absolute; inset: -50%; width: 200%; height: 200%; pointer-events: none;
      opacity: 0.055; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='170' height='170' filter='url(%23n)'/></svg>");
    }

    /* the one dark frame in the film. #1E2A38 — a deep indigo, never #000, because pure
       black on a hand-painted register reads as a slide dropped into a painting. */
    #f6-ground { position: absolute; inset: -18%; background: var(--night); }
    /* a very faint painted sky, multiplied down, so even the dark act sits on paint */
    #f6-ghost {
      position: absolute; inset: -18%; opacity: 0.16;
      background: url("public/img/sky-texture.jpg") center/cover no-repeat;
      mix-blend-mode: soft-light;
    }

    #f6-stage { position: absolute; inset: 0; }

    #f6-label {
      position: absolute; left: 150px; top: 86px;
      font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 700;
      font-size: 17px; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--night-mute);
    }
    #f6-head {
      position: absolute; left: 148px; top: 138px;
      font-family: "Zen Maru Gothic", sans-serif; font-weight: 700;
      font-size: 70px; line-height: 1.05; letter-spacing: -0.01em; color: var(--cloud);
    }

    /* the code well. Never dimmed with opacity — to de-emphasise a line, dim the LINE. */
    #f6-well {
      position: absolute; left: 148px; top: 244px; width: 1180px; height: 660px;
      border-radius: 12px; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      padding: 34px 40px; box-sizing: border-box;
    }
    .f6-ln {
      font-family: "JetBrains Mono", monospace; font-weight: 400;
      font-size: 25px; line-height: 1.62; color: var(--cloud);
      white-space: pre; letter-spacing: -0.005em;
    }
    .f6-ln.dim { color: var(--night-mute); }
    .f6-ln .k { color: #93C5C0; }
    .f6-ln .n { color: var(--cloud); font-weight: 700; }
    .f6-ln .p { color: #C9B98F; }

    /* the annotation: a hairline out of the highlighted value to one short note. */
    #f6-ann-line {
      position: absolute; left: 1328px; top: 420px; width: 172px; height: 1px;
      background: var(--terracotta-lit); transform-origin: 0% 50%;
    }
    #f6-ann {
      position: absolute; left: 1510px; top: 384px; width: 300px;
      font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 500;
      font-size: 27px; line-height: 1.34; color: var(--cloud);
    }
    #f6-ann small {
      display: block; margin-top: 10px;
      font-family: "JetBrains Mono", monospace; font-weight: 400;
      font-size: 17px; color: var(--night-mute);
    }

    #f6-caret {
      position: absolute; left: 40px; top: 34px; width: 13px; height: 27px;
      background: var(--terracotta-lit); opacity: 0.9;
    }

    #f6-cap {
      position: absolute; left: 150px; top: 936px;
      font-family: "JetBrains Mono", monospace; font-weight: 400;
      font-size: 20px; color: var(--night-mute);
    }
  </style>

  <div id="root" data-composition-id="06-manifest" data-width="1920" data-height="1080">
    <div id="f6-clip" class="clip" data-start="0" data-duration="12.5" data-track-index="0" data-layout-allow-overflow>
      <div id="f6-stage">
        <div id="f6-ground"></div>
        <div id="f6-ghost"></div>

        <div id="f6-label">the master playlist</div>
        <div id="f6-head">One text file lists them all.</div>

        <div id="f6-well"><div id="f6-caret"></div></div>

        <div id="f6-ann-line"></div>
        <div id="f6-ann">bits per second, not bytes<small>the one thing people misread here</small></div>

        <div id="f6-cap">index.m3u8 &middot; #EXTM3U &middot; RFC 8216 (HTTP Live Streaming)</div>

        <div class="seg-pill" id="f6-pill" style="background: rgba(255,255,255,0.09); box-shadow: none; color: #FDFBF4;">
          <b style="color:#FDFBF4">seg-00412.m4s</b><i style="background:rgba(255,255,255,0.22)"></i>
          <span class="seg-state"><span style="color:#F2A06B">in the playlist</span></span>
        </div>

        <div class="grain"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });

      // ---- the real master playlist. Valid HLS: RFC 8216 tags, RFC 6381 codec strings
      // (avc1.640028 = H.264 High@4.0, .64001f = High@3.1, .64001e = High@3.0;
      // mp4a.40.2 = AAC-LC). BANDWIDTH values match frame 5's ladder exactly.
      //
      // Each line is a list of [text, class] runs so the syntax colouring survives being
      // split to one span PER CHARACTER. That split is what makes the write continuous:
      // a per-line reveal moves for a sixth of each step and holds for the rest, which
      // measured 73% static. A character stream is a running system — the file is being
      // written, and the frame keeps delivering for six of its twelve seconds.
      var LINES = [
        [["#EXTM3U","k"]],
        [["#EXT-X-VERSION","k"],[":7",""]],
        [[" ",""]],
        [["#EXT-X-STREAM-INF","k"],[":BANDWIDTH=",""],["5800000","n"],[",",""]],
        [["  RESOLUTION=1920x1080,CODECS=\"",""],["avc1.640028,mp4a.40.2","p"],["\"",""]],
        [["  1080p/index.m3u8",""]],
        [[" ",""]],
        [["#EXT-X-STREAM-INF","k"],[":BANDWIDTH=2800000,",""]],
        [["  RESOLUTION=1280x720,CODECS=\"",""],["avc1.64001f,mp4a.40.2","p"],["\"",""]],
        [["  720p/index.m3u8",""]],
        [[" ",""]],
        [["#EXT-X-STREAM-INF","k"],[":BANDWIDTH=1400000,",""]],
        [["  RESOLUTION=854x480,CODECS=\"",""],["avc1.64001e,mp4a.40.2","p"],["\"",""]],
        [["  480p/index.m3u8",""]]
      ];
      var well = document.getElementById("f6-well");
      var caret = document.getElementById("f6-caret");
      var rows = [], glyphs = [], rowGlyphs = [];

      LINES.forEach(function (runs) {
        var d = document.createElement("div");
        d.className = "f6-ln";
        var mine = [];
        runs.forEach(function (run) {
          for (var i = 0; i < run[0].length; i++) {
            var g = document.createElement("span");
            g.className = run[1];
            g.style.whiteSpace = "pre";
            g.textContent = run[0][i];
            d.appendChild(g);
            glyphs.push(g); mine.push(g);
          }
        });
        well.appendChild(d); rows.push(d); rowGlyphs.push(mine);
      });

      // ---- SEAM 5 -> 6 ENTRY: ZOOM-THROUGH (z +1). Frame 05 pushed IN to 1.16; this side
      // enters from 0.80 and GROWS to 1.0 — same scale-velocity sign, so the two halves
      // read as one continuous push through the ladder INTO the file that describes it.
      // The ground, the heading and the first two lines are at full opacity from t=0.
      tl.fromTo("#f6-stage", { scale: 0.80 }, { scale: 1.0, duration: 0.46, ease: "power4.out" }, 0);
      gsap.set(glyphs.slice(rowGlyphs[0].length + rowGlyphs[1].length), { autoAlpha: 0 });
      gsap.set(["#f6-ann-line", "#f6-ann", "#f6-cap", "#f6-pill"], { autoAlpha: 0 });
      tl.fromTo("#f6-head", { y: 22 }, { y: 0, duration: 0.44, ease: "power3.out" }, 0);

      // Scene 2 (1.1-7.1s): the file writes itself, character by character, at ~72 c/s.
      var pending = glyphs.slice(rowGlyphs[0].length + rowGlyphs[1].length);
      var CPS = 72, T0 = 1.1;
      tl.to(pending, { autoAlpha: 1, duration: 0.01, ease: "none", stagger: 1 / CPS }, T0);

      // the caret rides the write head: it steps to each line as that line begins, so its
      // movement is CAUSED by the writing rather than being a decorative blink.
      var LH = 40.5, CW = 15.0, seen = rowGlyphs[0].length + rowGlyphs[1].length;
      for (var ri = 2; ri < rowGlyphs.length; ri++) {
        var n = rowGlyphs[ri].length;
        tl.to(caret, { y: ri * LH, duration: 0.09, ease: "power2.out" }, T0 + seen / CPS);
        tl.fromTo(caret, { x: 0 }, { x: n * CW, duration: n / CPS, ease: "none" }, T0 + seen / CPS);
        seen += n;
      }
      tl.to(caret, { autoAlpha: 0.3, duration: 0.5, ease: "power2.out" }, 7.4);
      tl.to(caret, { autoAlpha: 0, duration: 0.4 }, 10.6);

      // the ghost sky drifts — the register's wind, present even in the dark act.
      tl.fromTo("#f6-ghost", { xPercent: -0.5, yPercent: 0.3 },
                             { xPercent: 2.4, yPercent: -1.6, duration: 12.5, ease: "none" }, 0);

      // Scene 3 (7.4-9.6s): the 1080p BANDWIDTH lights, and the annotation draws out of it.
      // This is the frame's one accent and its one piece of teaching beyond the artefact.
      tl.fromTo("#f6-well .n", { color: "#FDFBF4" }, { color: "#EE8557", duration: 0.4, ease: "power2.out" }, 7.6);
      tl.set("#f6-ann-line", { autoAlpha: 1 }, 7.8);
      tl.fromTo("#f6-ann-line", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, 7.8);
      tl.to("#f6-ann", { autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 8.3);

      // the OTHER two bandwidth lines dim, so the eye goes where the annotation points.
      // Dim the LINE, never the well — a dark panel dimmed with opacity over a light film
      // is the grey-slab failure mode.
      tl.to(rowGlyphs[7].concat(rowGlyphs[11], rowGlyphs[8], rowGlyphs[12]),
            { color: "#A8BACB", duration: 0.5, ease: "power2.out" }, 7.7);

      // Scene 4 (9.6-10.9s): source caption + the continuity object.
      tl.to("#f6-cap", { autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 9.5);
      tl.fromTo("#f6-pill", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 9.8);

      // Scene 5 (10.9-12.5s): HELD dark and still. The film's second deliberate silence.

      // ---- SEAM 6 -> 7: back to the current, LEFT.
      tl.to("#f6-stage", { x: -238, duration: 0.34, ease: "power4.in" }, 12.16);

      window.__timelines = window.__timelines || {};
      window.__timelines["06-manifest"] = tl;
    })();
  </script>
</template>

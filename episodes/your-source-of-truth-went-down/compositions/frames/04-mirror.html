  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      // ---- SEAM 3 -> 4 ENTRY: cut-the-curve LEFT, +302 on power4.out.
      tl.fromTo("#f4-stage", { x: 302 }, { x: 0, duration: 0.43, ease: "power4.out" }, 0);
      // The primary surface and its headline are NOT faded up: they are at full opacity
      // from frame zero and ride the cut in on the stage. The seam gate measures MOTION, so
      // a frame whose content fades up at 0.4s still passes while entering visibly blank.

      // Scene 2 (0.4-2.6s): the two masses settle into place with their logos.
      tl.fromTo("#f4-mass-a", { scale: 0.90, x: -34 }, { scale: 1, x: 0, duration: 0.92, ease: "back.out(1.4)" }, 0.16);
      tl.fromTo("#f4-mass-b", { scale: 0.90, x: 34 },  { scale: 1, x: 0, duration: 0.92, ease: "back.out(1.4)" }, 0.26);
      tl.fromTo("#f4-lp-a", { scale: 0.90 }, { scale: 1, duration: 0.46, ease: "back.out(1.6)" }, 0.30);
      tl.fromTo("#f4-lp-b", { scale: 0.90 }, { scale: 1, duration: 0.46, ease: "back.out(1.6)" }, 0.40);

      // Scene 3 (2.6s onward): the channel opens and the packets run BOTH ways, without
      // stopping, for the rest of the frame. This is the frame's sustained motion — the
      // narration says "in real time", and the picture is what real time looks like.
      gsap.set("#f4-rail", { transformOrigin: "0% 50%" });
      tl.fromTo("#f4-rail", { scaleX: 0 }, { scaleX: 1, duration: 0.66, ease: "power3.out" }, 2.20);

      var chan = document.querySelector("#f4-chan"), RUN = 562;
      for (var i = 0; i < 14; i++) {
        var p = document.createElement("div"); p.className = "f4-pkt"; chan.appendChild(p);
        var rightward = i % 2 === 0;
        var phase = (i / 14) * 1.9;
        tl.fromTo(p, { x: rightward ? 0 : RUN, autoAlpha: 0 },
                     { x: rightward ? RUN : 0, autoAlpha: 1, duration: 1.9, ease: "none", repeat: 5 },
                  2.70 + phase);
      }

      // Scene 4 (5.4-8.2s): the stamp. Everything in the episode turns on this landing.
      tl.fromTo("#f4-stamp", { autoAlpha: 0, scale: 1.55, rotation: -22 },
                             { autoAlpha: 1, scale: 1, rotation: -7, duration: 0.62, ease: "back.out(1.7)" }, 5.40);
      tl.fromTo("#f4-pill", { autoAlpha: 0, x: -34 }, { autoAlpha: 1, x: 0, duration: 0.50, ease: "power3.out" }, 6.10);

      // Scene 5 (6.6-11.0s): the three facts, in Cursor's own framing.
      [6.40, 7.85, 9.30].forEach(function (t, i) {
        tl.fromTo("#f4-cap" + (i + 1), { autoAlpha: 0, x: -30 },
                  { autoAlpha: 1, x: 0, duration: 0.52, ease: "power3.out" }, t);
      });

      // ---- SEAM 4 -> 5: ZOOM-THROUGH (z +1). The exit pushes IN — scale grows past 1.0 —
      // and frame 05 enters from BELOW 1.0 and grows. Both halves share the sign of the
      // scale velocity; mirroring them reads as a bounce, not a move.
      tl.to("#f4-stage", { scale: 1.22, duration: 0.46, ease: "power4.in" }, 12.04);
      window.__timelines = window.__timelines || {};
      window.__timelines["04-mirror"] = tl;

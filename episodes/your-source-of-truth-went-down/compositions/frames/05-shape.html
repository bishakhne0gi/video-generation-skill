  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      // ---- SEAM 4 -> 5 ENTRY: ZOOM-THROUGH (z +1). Frame 04 exited GROWING to 1.22, so
      // this enters from BELOW 1.0 and grows to it. Same sign of scale velocity on both
      // halves — the whole point of the Z rule.
      tl.fromTo("#f5-stage", { scale: 0.80 }, { scale: 1, duration: 0.46, ease: "power4.out" }, 0);

      // Scene 2 (0.5-3.0s): the masses have not moved — that is what a zoom-through means.
      // Their name plates cross-fade from the product name to the role it is playing.
      gsap.set(["#f5-role-a", "#f5-role-b"], { autoAlpha: 0 });
      tl.to("#f5-word-a", { autoAlpha: 0, y: -18, duration: 0.34, ease: "power2.in" }, 1.30);
      tl.fromTo("#f5-role-a", { y: 20 }, { autoAlpha: 1, y: 0, duration: 0.42, ease: "power3.out" }, 1.56);
      tl.to("#f5-word-b", { autoAlpha: 0, y: -18, duration: 0.34, ease: "power2.in" }, 1.62);
      tl.fromTo("#f5-role-b", { y: 20 }, { autoAlpha: 1, y: 0, duration: 0.42, ease: "power3.out" }, 1.88);
      tl.fromTo("#f5-writes", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.46, ease: "power2.out" }, 2.24);

      // Scene 3 (3.0-6.4s): three systems the audience has already run.
      tl.fromTo(document.querySelectorAll(".f5-chip"), { autoAlpha: 0, y: 26 },

      // Scene 4 (4.6-9.2s): the teaching line.
      tl.fromTo("#f5-line", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.58, ease: "power3.out" }, 4.60);

      // Scene 5 (2.4s onward): writes ARRIVING, alternately, at both masses — the running
      // system that carries the back half of the beat. "Both accept writes" was a caption;
      // this is the thing the caption describes.
      var stage = document.querySelector("#f5-stage");
      for (var w = 0; w < 12; w++) {
        var m = document.createElement("div"); m.className = "f5-wm"; stage.appendChild(m);
        var toLeft = w % 2 === 0;
        tl.fromTo(m, { x: toLeft ? 1010 : 910, autoAlpha: 0 },
                     { x: toLeft ? 560 : 1360, autoAlpha: 1, duration: 1.15, ease: "power1.inOut", repeat: 5, repeatDelay: 0.45 },
                  2.40 + (w / 12) * 1.6);

      // ---- SEAM 5 -> 6: cut-the-curve LEFT (the current).
      tl.to("#f5-stage", { x: -238, duration: 0.34, ease: "power4.in" }, 10.66);
      window.__timelines = window.__timelines || {};
      window.__timelines["05-shape"] = tl;

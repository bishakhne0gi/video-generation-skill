<template>
  <style>
    @font-face { font-family: "Bricolage Grotesque"; src: url("assets/fonts/Bricolage-700.woff2") format("woff2"); font-weight: 700; font-display: block; }
    @font-face { font-family: "Bricolage Grotesque"; src: url("assets/fonts/Bricolage-800.woff2") format("woff2"); font-weight: 800; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-600.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono-400.woff2") format("woff2"); font-weight: 400; font-display: block; }
    @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono-700.woff2") format("woff2"); font-weight: 700; font-display: block; }

    #root {
      position: relative; width: 1920px; height: 1080px; overflow: hidden; container-type: size;
      --primary: #ea2804; --glow: #ff6a3d; --pink: #f4a8a0;
      --on-primary: #ffffff; --ink: #202020; --card: #ffffff;
    }

    /* the fire register: full-bleed orange + the hero atmospheric mesh, on a .clip layer */
    #f2-ground { position: absolute; inset: 0; background: var(--primary); }
    #f2-mesh {
      position: absolute; inset: -8%; transform-origin: 50% 40%;
      background:
        radial-gradient(ellipse 62% 54% at 50% 26%, var(--glow) 0%, rgba(255,106,61,0.0) 64%),
        radial-gradient(ellipse 96% 52% at 50% 112%, var(--pink) 0%, rgba(244,168,160,0.0) 72%),
        radial-gradient(ellipse 40% 34% at 16% 78%, rgba(255,106,61,0.55) 0%, rgba(255,106,61,0) 70%);
    }

    #f2-stage { position: absolute; inset: 0; }

    /* display only on the band — measured: neither white (4.4:1) nor ink (3.7:1) clears
       body AA on #ea2804, so no small type touches it. Chrome goes inside a white pill. */
    .f2-line {
      position: absolute; left: 0; width: 1920px; text-align: center;
      font-family: "Bricolage Grotesque", sans-serif; font-weight: 800;
      font-size: 168px; line-height: 0.9; letter-spacing: -0.03em;
      color: var(--on-primary);
    }
    #f2-l1 { top: 262px; }
    #f2-l2 { top: 566px; }
    #f2-neq {
      position: absolute; left: 0; width: 1920px; text-align: center; top: 438px;
      font-family: "Bricolage Grotesque", sans-serif; font-weight: 700;
      font-size: 116px; line-height: 1; color: var(--on-primary);
    }

    #f2-pill {
      position: absolute; left: 50%; margin-left: -168px; top: 132px; width: 336px;
      display: flex; align-items: center; justify-content: center; gap: 14px;

    #f2-pill s { text-decoration: none; font-weight: 400; opacity: 0.55; }

    #f2-grain {
      position: absolute; inset: -50%; width: 200%; height: 200%; pointer-events: none;

  <div id="root" data-composition-id="02-title" data-width="1920" data-height="1080">
    <div id="f2-ground" class="clip" data-start="0" data-duration="5" data-track-index="0">
      <div id="f2-mesh"></div>

    <div id="f2-stage">
      <div class="f2-line" id="f2-l1">Authentication</div>
      <div id="f2-neq">&ne;</div>
      <div class="f2-line" id="f2-l2">Authorisation</div>
      <div id="f2-pill">EP 23 <s>/</s> Who vs What</div>
      <div id="f2-grain"></div>

  </div>

  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });

      // ---- SEAM 1 -> 2 ENTRY: cut-the-curve LEFT. Frame 01 exited travelling left at
      // -232 on power4.in; this side enters from +295 (≈127% of the exit travel) on
      // power4.out, so the cut lands mid-motion on both sides and the eye's momentum
      // carries straight through it.
      tl.fromTo("#f2-l1", { x: 295, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.43, ease: "power4.out" }, 0);

      // Scene 1 (0.0–1.4s): the band is already full-bleed, carried in by the seam.
      // ONE slow one-way drift on the mesh — a direction, not an oscillation, so it is
      // texture rather than idle wobble.
      tl.fromTo("#f2-mesh", { scale: 1.0, y: 0 }, { scale: 1.07, y: -22, duration: 5, ease: "none" }, 0);

      // Scene 2 (1.4–2.6s): the second word lands, then the ≠ snaps in last — the one
      // restrained move this blueprint allows.
      tl.fromTo("#f2-l2", { autoAlpha: 0, y: 46 }, { autoAlpha: 1, y: 0, duration: 0.52, ease: "power3.out" }, 1.32);
      tl.fromTo("#f2-neq", { autoAlpha: 0, scale: 0.62 }, { autoAlpha: 1, scale: 1, duration: 0.44, ease: "back.out(1.6)" }, 2.02);

      // Scene 3 (2.6–3.6s): the episode mark, inside a white pill so its small mono type
      // never sits directly on the orange.
      tl.fromTo("#f2-pill", { autoAlpha: 0, y: -18 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.62);

      // Scene 4 (3.6–5.0s): HELD. Nothing moves but the mesh and the grain. One of the
      // film's three placed still beats, and where the bed lifts its full amount.

      // ---- SEAM 2 -> 3: cut-the-curve LEFT (the current).
      tl.to("#f2-stage", { x: -232, duration: 0.34, ease: "power4.in" }, 4.66);

      window.__timelines = window.__timelines || {};
      window.__timelines["02-title"] = tl;
    })();
  </script>

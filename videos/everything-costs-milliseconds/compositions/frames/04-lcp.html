<template>
  <style>
@font-face{font-family:"Archivo";src:url("assets/fonts/Archivo-var.woff2") format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:block}
@font-face{font-family:"JBMono";src:url("assets/fonts/JetBrainsMono-400.woff2") format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"JBMono";src:url("assets/fonts/JetBrainsMono-700.woff2") format("woff2");font-weight:700;font-display:block}
@font-face{font-family:"Instrument";src:url("assets/fonts/InstrumentSerif-italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:block}

#root{position:relative;width:1920px;height:1080px;overflow:hidden;
  --void:#091413; --forest:#285A48; --emerald:#408A71; --emerald-lit:#6FD0AA;
  --mint:#B0E4CC; --brass:#E8A13C; --ink:#091413;
  background:var(--void); font-family:"Archivo",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;}
#root *{margin:0;padding:0;box-sizing:border-box}

/* ---- the field: one plate per act, dimmed, never absent ---- */
.plate{position:absolute;inset:0;background-size:cover;background-position:center}
.scrim{position:absolute;inset:0}
/* stage carries every seam move; content never animates the clip itself */
.stage{position:absolute;inset:0}
.inner{position:relative;z-index:1;width:100%;height:100%}

/* ---- MATERIAL: bezel -> face -> glass. All lighting static. ---- */
.bezel{position:absolute;background-image:url("assets/plates/brass.jpg");
  background-size:cover;background-position:center;
  box-shadow:inset 2px 2px 5px rgba(255,236,196,.55), inset -3px -3px 7px rgba(0,0,0,.62),
             0 18px 44px rgba(0,0,0,.62), 0 2px 0 rgba(255,236,196,.14)}
.face{position:absolute;background:
   radial-gradient(120% 120% at 32% 22%, #2E6551 0%, #16302A 46%, #091413 100%);
  box-shadow:inset 0 8px 26px rgba(0,0,0,.66), inset 0 -2px 0 rgba(255,255,255,.05)}
/* .glasscap is the DOME photograph and belongs to ROUND instruments only. Laid over a
   rectangular case it reads as a dark ellipse floating on the content. Flat covers get
   .glassflat: a sheen, not a photograph. */
.glasscap{position:absolute;pointer-events:none;
  background-image:url("assets/plates/glass.jpg");background-size:cover;background-position:center;
  mix-blend-mode:screen;opacity:.20}
.glassflat{position:absolute;pointer-events:none;background:
  linear-gradient(176deg, rgba(176,228,204,.09) 0%, rgba(176,228,204,.02) 18%,
                  rgba(255,255,255,0) 46%, rgba(9,20,19,.16) 100%);
  box-shadow:inset 0 1px 0 rgba(176,228,204,.20)}
.spec{position:absolute;pointer-events:none;background:
  linear-gradient(107deg, rgba(255,255,255,0) 34%, rgba(255,255,255,.07) 46%,
                  rgba(255,255,255,.02) 53%, rgba(255,255,255,0) 62%)}
.leather{background-image:url("assets/plates/leather.jpg");background-size:cover;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08), 0 16px 40px rgba(0,0,0,.55)}

/* the needle — the film's signature. transform-origin at the pivot. */
.needle{position:absolute;transform-origin:50% 100%;
  background:linear-gradient(180deg,var(--mint) 0%, #7FC4A6 62%, #33604F 100%);
  box-shadow:0 0 12px rgba(176,228,204,.36), 0 2px 5px rgba(0,0,0,.6);border-radius:2px}
.needle.hot{background:linear-gradient(180deg,var(--brass) 0%, #C07C22 70%, #4A3210 100%);
  box-shadow:0 0 16px rgba(232,161,60,.44), 0 2px 5px rgba(0,0,0,.6)}
.hub{position:absolute;border-radius:50%;background-image:url("assets/plates/brass.jpg");
  background-size:cover;box-shadow:inset 1px 1px 3px rgba(255,236,196,.6),
  inset -2px -2px 4px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.7)}

/* ---- TYPE ---- */
.hdr{font-weight:800;font-stretch:125%;letter-spacing:-.04em;color:var(--mint);line-height:.94}
.lead{font-weight:400;color:var(--mint);opacity:.86;line-height:1.28}
.mono{font-family:"JBMono",monospace;color:var(--emerald-lit)}
.tag{font-family:"JBMono",monospace;font-weight:700;letter-spacing:.18em;
  color:var(--emerald-lit);font-size:21px}
.hot{color:var(--brass)}
.chipmint{background:var(--mint);color:var(--ink);font-family:"JBMono",monospace;
  font-weight:700;border-radius:5px;display:inline-block}
/* one black + a hairline for every surface. no coloured edges, ever. */
.panel{position:absolute;background:#0B100F;border:1px solid rgba(176,228,204,.14);
  border-radius:10px;box-shadow:0 20px 48px rgba(0,0,0,.6)}
.rule{position:absolute;background:var(--emerald);height:2px}

  </style>

  <div id="root" data-composition-id="04-lcp" data-start="0" data-width="1920" data-height="1080">

    <div class="plate" style="background-image:url('assets/plates/lamplit.jpg');opacity:0.5"></div>
  <div class="scrim" style="background:radial-gradient(78% 90% at 30% 26%, rgba(9,20,19,.30) 0%, rgba(9,20,19,.86) 62%, rgba(9,20,19,.96) 100%)"></div>
    <div id="stage" class="stage"><div class="inner">
      
      <div id="s-tag" class="tag" style="position:absolute;left:118px;top:112px">02 · LARGEST CONTENTFUL PAINT</div>
      <div id="s-rule" class="rule" style="left:118px;top:150px;width:96px;transform-origin:0% 50%"></div>
      <div id="s-hdr" class="hdr" style="position:absolute;left:118px;top:176px;width:1180px;font-size:82px">The biggest<br>thing you paint.</div>
      <div id="s-lead" class="lead" style="position:absolute;left:120px;top:372px;width:840px;font-size:31px">LCP is the moment the largest element in the viewport finishes rendering. Almost always an image &mdash; and almost always discovered too late.</div>

      <div class="bezel" style="left:1202px;top:414px;width:500px;height:500px;border-radius:50%"></div>
      <div class="face"  style="left:1228px;top:440px;width:448px;height:448px;border-radius:50%"></div>

      <svg id="l-arc" style="position:absolute;left:1228px;top:440px" width="448" height="448" viewBox="0 0 448 448">
        <path d="M 47.3 326.0 A 204 204 0 0 1 154.2 32.3" fill="none" stroke="#408A71" stroke-width="13" stroke-linecap="round" opacity=".85"/>
        <path d="M 154.2 32.3 A 204 204 0 0 1 400.7 326.0" fill="none" stroke="#E8A13C" stroke-width="13" stroke-linecap="round" opacity=".62"/>
      </svg>
      <div id="l-ticks" style="position:absolute;left:1228px;top:440px;width:448px;height:448px"></div>

      <div id="l-needle" class="needle hot" style="left:1448px;top:478px;width:8px;height:186px"></div>
      <div class="hub" style="left:1433px;top:645px;width:38px;height:38px"></div>

      <div id="l-read" style="position:absolute;left:1292px;top:750px;width:320px;text-align:center">
        <div id="l-val" class="mono hot" style="font-size:58px;font-weight:700;line-height:1.18">3.8s</div>
        <div class="mono" style="font-size:17px;letter-spacing:.16em;opacity:.62;margin-top:8px">BUDGET 2.5s</div></div>

      <div id="l-vp" class="panel" style="left:158px;top:562px;width:660px;height:378px"></div>
      <div id="l-vplbl" class="mono" style="position:absolute;left:178px;top:582px;font-size:17px;letter-spacing:.14em;opacity:.6">VIEWPORT &middot; 1440&times;810</div>
      <div id="l-nav" style="position:absolute;left:178px;top:614px;width:620px;height:26px;background:rgba(176,228,204,.08);border-radius:5px"></div>
      <div id="l-hero" style="position:absolute;left:178px;top:654px;width:620px;height:196px;
        background:linear-gradient(148deg,rgba(64,138,113,.34),rgba(9,20,19,.9));border:2px solid var(--brass);border-radius:8px"></div>
      <div id="l-herolbl" style="position:absolute;left:190px;top:666px">
        <span class="chipmint hot" style="background:var(--brass);font-size:15px;padding:4px 9px">LCP ELEMENT</span></div>
      <div id="l-herofile" class="mono" style="position:absolute;left:190px;top:812px;font-size:19px;color:var(--mint)">hero.avif &middot; 1440&times;810 &middot; 214 KB</div>
      <div id="l-rows" style="position:absolute;left:178px;top:866px;width:620px;height:56px"></div>
      <div id="l-needle-ok" class="needle" style="left:1448px;top:478px;width:8px;height:186px"></div>
      <div id="l-fix" style="position:absolute;left:158px;top:966px;width:1120px">
        <div class="mono" style="font-size:19px;color:var(--emerald-lit)">
          <span style="color:var(--mint);font-weight:700">preload</span> the hero and mark it
          <span style="color:var(--mint);font-weight:700">fetchpriority="high"</span> &mdash; discovered in the first round trip</div>
      </div>
      <div id="l-val2" style="position:relative;position:absolute;left:1292px;top:750px;width:320px;height:70px;text-align:center;font-family:'JBMono',monospace;font-size:58px;font-weight:700;line-height:1.18;color:var(--mint)"><span id="l-val2-0" style="position:absolute;left:0;top:0;white-space:nowrap">3.8s</span><span id="l-val2-1" style="position:absolute;left:0;top:0;white-space:nowrap">3.1s</span><span id="l-val2-2" style="position:absolute;left:0;top:0;white-space:nowrap">2.6s</span><span id="l-val2-3" style="position:absolute;left:0;top:0;white-space:nowrap">2.1s</span></div>
    </div></div>
  </div>

  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      // SEAM ENTRY — across, cut-the-curve LEFT. Enters mid-flight at full opacity:
      // the gate measures MOTION, so a frame that fades up still enters visibly blank.
      tl.fromTo("#stage", { x: 300 }, { x: 0, duration: 0.43, ease: "power4.out" }, 0);
      // SEAM CARRIER — the box tag and the headline are at FULL opacity from frame zero
      // and ride the cut in on the stage. They are never faded up: the seam gate measures
      // MOTION, so a station whose content fades in at 0.1s passes the gate while visibly
      // entering on an empty frame. Only the rule and the lead line are staged.
      tl.fromTo("#s-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.50, ease: "power3.out" }, 0.14);
      tl.fromTo("#s-hdr",  { y: 14 }, { y: 0, duration: 0.52, ease: "power3.out" }, 0);
      tl.fromTo("#s-lead", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.52, ease: "power3.out" }, 0.30000000000000004);
      // graduations, so the face is an instrument and not a pie chart
      var ticks = document.querySelector("#l-ticks");
      for (var v = 0; v <= 6; v += 0.5) {
        var major = Math.abs(v % 1) < 0.01, t = document.createElement("div");
        t.style.cssText = "position:absolute;left:223px;top:14px;width:" + (major?3:2) + "px;height:" + (major?17:10) +
          "px;background:rgba(176,228,204," + (major?".72":".38") + ");transform-origin:50% 210px;transform:rotate(" +
          (-120 + (v/6)*240) + "deg)";
        ticks.appendChild(t);
      }
      tl.fromTo("#l-ticks", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5, ease: "power2.out" }, 0.20);
      tl.fromTo("#l-arc",   { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.6, ease: "power2.out" }, 0.28);
      // the viewport builds first — you have to see WHAT is being measured before the reading.
      tl.fromTo("#l-vp",    { autoAlpha: 0, scale: 0.97 }, { autoAlpha: 1, scale: 1, duration: 0.56, ease: "power3.out" }, 0.40);
      tl.fromTo("#l-vplbl", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.36 }, 0.60);
      tl.fromTo("#l-nav",   { autoAlpha: 0, x: -18 }, { autoAlpha: 1, x: 0, duration: 0.40, ease: "power3.out" }, 0.72);
      tl.fromTo("#l-hero",  { autoAlpha: 0, scale: 0.94 }, { autoAlpha: 1, scale: 1, duration: 0.58, ease: "back.out(1.3)" }, 1.30);
      tl.fromTo("#l-herolbl",  { autoAlpha: 0, y: -10 }, { autoAlpha: 1, y: 0, duration: 0.40, ease: "power3.out" }, 1.72);
      tl.fromTo("#l-herofile", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.40 }, 1.92);
      var rows = document.querySelector("#l-rows");
      for (var i = 0; i < 3; i++) {
        var r = document.createElement("div");
        r.style.cssText = "position:absolute;left:0;top:" + (i*20) + "px;width:" + (560 - i*150) +
          "px;height:9px;background:rgba(176,228,204,.10);border-radius:4px";
        rows.appendChild(r);
        tl.fromTo(r, { autoAlpha: 0, x: -14 }, { autoAlpha: 1, x: 0, duration: 0.34, ease: "power3.out" }, 2.10 + i*0.08);
      }
      // THE NEEDLE — the beat's payoff. Brass, because 3.8s is over the 2.5s budget.
      gsap.set("#l-needle", { rotation: -120.00 });
      tl.fromTo("#l-needle", { rotation: -120 }, { rotation: 38.08, duration: 0.74, ease: "power3.out" }, 3.30);
      tl.to("#l-needle", { rotation: 32, duration: 0.42, ease: "elastic.out(1, 0.62)" }, 4.04);
      tl.fromTo("#l-read", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.44, ease: "power3.out" }, 4.16);
      // it does not settle and stop: the reading breathes as the sample keeps arriving,
      // which is what a live instrument does and what stops the beat going dead.
      tl.to("#l-needle", { rotation: 34.40, duration: 1.5, ease: "sine.inOut", repeat: 3, yoyo: true }, 5.10);
      // THE FIX — the same page with the hero preloaded. The needle is the only place
      // this could land: it falls out of the brass arc and into the green, and the film
      // has spent the whole beat teaching you to read exactly that.
      gsap.set("#l-needle-ok", { rotation: 32.00, autoAlpha: 0 });
      tl.fromTo("#l-fix", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.46, ease: "power3.out" }, 6.30);
      tl.set("#l-read", { autoAlpha: 0 }, 6.90);
      tl.set("#l-needle", { autoAlpha: 0 }, 6.90);
      tl.set("#l-needle-ok", { autoAlpha: 1 }, 6.90);
      tl.to("#l-needle-ok", { rotation: -38.20, duration: 1.60, ease: "power3.inOut" }, 6.90);
      tl.to("#l-needle-ok", { rotation: -36.00, duration: 0.46, ease: "elastic.out(1, 0.62)" }, 8.50);
      tl.to("#l-hero", { borderColor: "rgba(176,228,204,0.95)", duration: 0.5, ease: "power2.out" }, 7.10);
      for (var _r = 0; _r < 4; _r++) gsap.set("#l-val2-" + _r, { autoAlpha: 0 });
      tl.set("#l-val2-0", { autoAlpha: 1 }, 6.90);
      tl.set("#l-val2-1", { autoAlpha: 1 }, 7.52);
      tl.set("#l-val2-0", { autoAlpha: 0 }, 7.52);
      tl.set("#l-val2-2", { autoAlpha: 1 }, 8.14);
      tl.set("#l-val2-1", { autoAlpha: 0 }, 8.14);
      tl.set("#l-val2-3", { autoAlpha: 1 }, 8.76);
      tl.set("#l-val2-2", { autoAlpha: 0 }, 8.76);
      // it settles, and then keeps reading — a live instrument never fully stills.
      tl.to("#l-needle-ok", { rotation: -34.10, duration: 1.3, ease: "sine.inOut", repeat: 1, yoyo: true }, 9.10);
      // SEAM EXIT — across, travelling LEFT out of frame at matched velocity.
      tl.to("#stage", { x: -236, duration: 0.34, ease: "power4.in" }, 11.09);
      window.__timelines = window.__timelines || {};
      window.__timelines["04-lcp"] = tl;
    })();
  </script>

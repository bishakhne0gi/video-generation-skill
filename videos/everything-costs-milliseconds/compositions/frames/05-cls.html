/* ---- the field: one plate per act, dimmed, never absent ---- */
.plate{position:absolute;inset:0;background-size:cover;background-position:center}
.scrim{position:absolute;inset:0}
/* stage carries every seam move; content never animates the clip itself */
.stage{position:absolute;inset:0}
.inner{position:relative;z-index:1;width:100%;height:100%}

/* ---- MATERIAL: bezel -> face -> glass. All lighting static. ---- */
.bezel{position:absolute;background-image:url("assets/plates/brass.jpg");
  background-size:cover;background-position:center;
  box-shadow:inset 2px 2px 5px rgba(255,236,196,.55), inset -3px -3px 7px rgba(0,0,0,.62),

   radial-gradient(120% 120% at 32% 22%, #2E6551 0%, #16302A 46%, #091413 100%);
  box-shadow:inset 0 8px 26px rgba(0,0,0,.66), inset 0 -2px 0 rgba(255,255,255,.05)}
/* .glasscap is the DOME photograph and belongs to ROUND instruments only. Laid over a
   rectangular case it reads as a dark ellipse floating on the content. Flat covers get
   .glassflat: a sheen, not a photograph. */
.glasscap{position:absolute;pointer-events:none;
  background-image:url("assets/plates/glass.jpg");background-size:cover;background-position:center;
  mix-blend-mode:screen;opacity:.20}
.glassflat{position:absolute;pointer-events:none;background:
  linear-gradient(176deg, rgba(176,228,204,.09) 0%, rgba(176,228,204,.02) 18%,

  box-shadow:inset 0 1px 0 rgba(176,228,204,.20)}
.spec{position:absolute;pointer-events:none;background:
  linear-gradient(107deg, rgba(255,255,255,0) 34%, rgba(255,255,255,.07) 46%,
                  rgba(255,255,255,.02) 53%, rgba(255,255,255,0) 62%)}
.leather{background-image:url("assets/plates/leather.jpg");background-size:cover;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08), 0 16px 40px rgba(0,0,0,.55)}

/* the needle — the film's signature. transform-origin at the pivot. */
.needle{position:absolute;transform-origin:50% 100%;
  background:linear-gradient(180deg,var(--mint) 0%, #7FC4A6 62%, #33604F 100%);
  box-shadow:0 0 12px rgba(176,228,204,.36), 0 2px 5px rgba(0,0,0,.6);border-radius:2px}
.needle.hot{background:linear-gradient(180deg,var(--brass) 0%, #C07C22 70%, #4A3210 100%);

.hub{position:absolute;border-radius:50%;background-image:url("assets/plates/brass.jpg");
  background-size:cover;box-shadow:inset 1px 1px 3px rgba(255,236,196,.6),
  inset -2px -2px 4px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.7)}

/* ---- TYPE ---- */
.hdr{font-weight:800;font-stretch:125%;letter-spacing:-.04em;color:var(--mint);line-height:.94}
.lead{font-weight:400;color:var(--mint);opacity:.86;line-height:1.28}
.mono{font-family:"JBMono",monospace;color:var(--emerald-lit)}
.tag{font-family:"JBMono",monospace;font-weight:700;letter-spacing:.18em;
  color:var(--emerald-lit);font-size:21px}
.hot{color:var(--brass)}
.chipmint{background:var(--mint);color:var(--ink);font-family:"JBMono",monospace;
  font-weight:700;border-radius:5px;display:inline-block}
/* one black + a hairline for every surface. no coloured edges, ever. */
.panel{position:absolute;background:#0B100F;border:1px solid rgba(176,228,204,.14);
  border-radius:10px;box-shadow:0 20px 48px rgba(0,0,0,.6)}
.rule{position:absolute;background:var(--emerald);height:2px}

  </style>

  <div id="root" data-composition-id="05-cls" data-start="0" data-width="1920" data-height="1080">

    <div class="plate" style="background-image:url('assets/plates/lamplit.jpg');opacity:0.5"></div>
  <div class="scrim" style="background:radial-gradient(78% 90% at 30% 26%, rgba(9,20,19,.30) 0%, rgba(9,20,19,.86) 62%, rgba(9,20,19,.96) 100%)"></div>
    <div id="stage" class="stage"><div class="inner">
      
      <div id="s-tag" class="tag" style="position:absolute;left:118px;top:112px">03 · CUMULATIVE LAYOUT SHIFT</div>

          background:rgba(232,161,60,.10);display:flex;align-items:center;justify-content:center">
          <span class="mono hot" style="font-size:19px;letter-spacing:.14em">AD SLOT &middot; 612&times;118 &middot; ARRIVED LATE</span></div></div>
      <div id="c-body" style="position:absolute;left:182px;top:548px;width:612px;height:380px"></div>

      <div id="c-fix" style="position:absolute;left:1010px;top:912px;width:800px">
        <div class="mono" style="font-size:19px;color:var(--emerald-lit)">
          give the slot its <span style="color:var(--mint);font-weight:700">width and height up front</span> &mdash;
          the ad still arrives late, but nothing moves when it does</div></div>
      <div id="c-score2" style="position:relative;position:absolute;left:1650px;top:870px;width:140px;height:48px;text-align:right;font-family:'JBMono',monospace;font-size:38px;font-weight:700;color:var(--mint)"><span id="c-score2-0" style="position:absolute;left:0;top:0;white-space:nowrap">0.24</span><span id="c-score2-1" style="position:absolute;left:0;top:0;white-space:nowrap">0.19</span><span id="c-score2-2" style="position:absolute;left:0;top:0;white-space:nowrap">0.11</span><span id="c-score2-3" style="position:absolute;left:0;top:0;white-space:nowrap">0.02</span></div>
    </div></div>

  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      // SEAM ENTRY — across, cut-the-curve LEFT. Enters mid-flight at full opacity:
      // the gate measures MOTION, so a frame that fades up still enters visibly blank.
      tl.fromTo("#stage", { x: 300 }, { x: 0, duration: 0.43, ease: "power4.out" }, 0);
      // SEAM CARRIER — the box tag and the headline are at FULL opacity from frame zero
      // and ride the cut in on the stage. They are never faded up: the seam gate measures
      // MOTION, so a station whose content fades in at 0.1s passes the gate while visibly
      // entering on an empty frame. Only the rule and the lead line are staged.
      tl.fromTo("#s-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.50, ease: "power3.out" }, 0.14);
      tl.fromTo("#s-hdr",  { y: 14 }, { y: 0, duration: 0.52, ease: "power3.out" }, 0);
      tl.fromTo("#s-lead", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.52, ease: "power3.out" }, 0.30000000000000004);
      tl.fromTo("#c-doc", { autoAlpha: 0, scale: 0.97 }, { autoAlpha: 1, scale: 1, duration: 0.54, ease: "power3.out" }, 0.10);
      var bodyEl = document.querySelector("#c-body"), W = [612, 560, 596, 512];
      for (var i = 0; i < 4; i++) {
        var r = document.createElement("div");
        r.style.cssText = "position:absolute;left:0;top:" + (i*30) + "px;width:" + W[i] +
          "px;height:14px;background:rgba(176,228,204,.13);border-radius:7px";
        bodyEl.appendChild(r);
        tl.fromTo(r, { autoAlpha: 0, x: -12 }, { autoAlpha: 1, x: 0, duration: 0.30, ease: "power3.out" }, 0.34 + i*0.07);
      }
      tl.fromTo("#c-btn", { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.44, ease: "power3.out" }, 0.72);
      // the reader aims at the button...
      tl.fromTo("#c-cur", { autoAlpha: 0, x: 120, y: 70 }, { autoAlpha: 1, x: 0, y: 0, duration: 0.72, ease: "power3.out" }, 1.60);
      // ...and the slot arrives late, pushing everything below it DOWN. Height is not
      // animatable, so the slot's clip opens on scaleY and the rows below translate.
      gsap.set("#c-slot", { height: 118, scaleY: 0, transformOrigin: "50% 0%" });
      tl.to("#c-slot", { scaleY: 1, duration: 0.28, ease: "power4.out" }, 3.20);
      tl.to("#c-body", { y: 130, duration: 0.28, ease: "power4.out" }, 3.20);
      tl.to("#c-btn",  { y: 130, duration: 0.28, ease: "power4.out" }, 3.20);
      // the click lands on nothing, because the button left.
      tl.to("#c-cur", { scale: 0.84, duration: 0.09, ease: "power2.in" }, 3.42);
      tl.to("#c-cur", { scale: 1, duration: 0.16, ease: "power2.out" }, 3.51);
      // the bubble is the metric. It runs off centre on the same frame the content jumps.
      tl.to("#c-bub", { x: 214, duration: 0.30, ease: "power4.out" }, 3.20);
      tl.to("#c-bub", { x: 188, duration: 0.90, ease: "elastic.out(1, 0.5)" }, 3.50);
      tl.fromTo("#c-read", { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.44, ease: "power3.out" }, 4.30);
      // a spirit level never fully stills — the bubble keeps hunting, and the beat keeps moving.
      tl.to("#c-bub", { x: 200, duration: 0.85, ease: "sine.inOut", repeat: 1, yoyo: true }, 5.20);
      // THE FIX — the reserved slot. The page is rebuilt with the space already held,
      // the ad lands into it, and the bubble walks back to dead centre and STAYS there.
      tl.fromTo("#c-fix", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.46, ease: "power3.out" }, 6.40);
      tl.to("#c-body", { y: 130, duration: 0.01 }, 6.90);
      tl.to("#c-btn",  { y: 130, duration: 0.01 }, 6.90);
      tl.to("#c-slot", { borderColor: "rgba(176,228,204,0.7)", duration: 0.4 }, 7.00);
      tl.set("#c-read", { autoAlpha: 0 }, 7.10);
      tl.to("#c-bub", { x: 0, duration: 1.70, ease: "power2.inOut" }, 7.10);
      tl.to("#c-bub", { x: 6, duration: 0.70, ease: "elastic.out(1, 0.5)" }, 8.80);
      // the cursor comes back and this time the button is where it was aimed.
      tl.to("#c-cur", { x: 0, y: 130, duration: 0.70, ease: "power3.out" }, 8.10);
      tl.to("#c-cur", { scale: 0.84, duration: 0.09, ease: "power2.in" }, 8.90);
      tl.to("#c-cur", { scale: 1, duration: 0.16, ease: "power2.out" }, 8.99);
      for (var _r = 0; _r < 4; _r++) gsap.set("#c-score2-" + _r, { autoAlpha: 0 });
      tl.set("#c-score2-0", { autoAlpha: 1 }, 7.10);
      tl.set("#c-score2-1", { autoAlpha: 1 }, 7.62);
      tl.set("#c-score2-0", { autoAlpha: 0 }, 7.62);
      tl.set("#c-score2-2", { autoAlpha: 1 }, 8.14);
      tl.set("#c-score2-1", { autoAlpha: 0 }, 8.14);
      tl.set("#c-score2-3", { autoAlpha: 1 }, 8.66);
      tl.set("#c-score2-2", { autoAlpha: 0 }, 8.66);
      // SEAM EXIT — across, travelling LEFT out of frame at matched velocity.
      tl.to("#stage", { x: -236, duration: 0.34, ease: "power4.in" }, 11.80);
      window.__timelines = window.__timelines || {};
      window.__timelines["05-cls"] = tl;
    })();
  </script>

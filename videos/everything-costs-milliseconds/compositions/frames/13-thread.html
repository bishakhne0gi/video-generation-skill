/* ---- the field: one plate per act, dimmed, never absent ---- */
.plate{position:absolute;inset:0;background-size:cover;background-position:center}
.scrim{position:absolute;inset:0}
/* stage carries every seam move; content never animates the clip itself */
.stage{position:absolute;inset:0}
.inner{position:relative;z-index:1;width:100%;height:100%}

  box-shadow:inset 0 8px 26px rgba(0,0,0,.66), inset 0 -2px 0 rgba(255,255,255,.05)}
/* .glasscap is the DOME photograph and belongs to ROUND instruments only. Laid over a
   rectangular case it reads as a dark ellipse floating on the content. Flat covers get
   .glassflat: a sheen, not a photograph. */
.glasscap{position:absolute;pointer-events:none;
  background-image:url("assets/plates/glass.jpg");background-size:cover;background-position:center;
  mix-blend-mode:screen;opacity:.20}
.glassflat{position:absolute;pointer-events:none;background:

.spec{position:absolute;pointer-events:none;background:
  linear-gradient(107deg, rgba(255,255,255,0) 34%, rgba(255,255,255,.07) 46%,
                  rgba(255,255,255,.02) 53%, rgba(255,255,255,0) 62%)}
.leather{background-image:url("assets/plates/leather.jpg");background-size:cover;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08), 0 16px 40px rgba(0,0,0,.55)}

/* the needle — the film's signature. transform-origin at the pivot. */
.needle{position:absolute;transform-origin:50% 100%;
  background:linear-gradient(180deg,var(--mint) 0%, #7FC4A6 62%, #33604F 100%);

.hub{position:absolute;border-radius:50%;background-image:url("assets/plates/brass.jpg");

  inset -2px -2px 4px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.7)}

/* ---- TYPE ---- */
.hdr{font-weight:800;font-stretch:125%;letter-spacing:-.04em;color:var(--mint);line-height:.94}
.lead{font-weight:400;color:var(--mint);opacity:.86;line-height:1.28}
.mono{font-family:"JBMono",monospace;color:var(--emerald-lit)}
.tag{font-family:"JBMono",monospace;font-weight:700;letter-spacing:.18em;

.hot{color:var(--brass)}
.chipmint{background:var(--mint);color:var(--ink);font-family:"JBMono",monospace;
  font-weight:700;border-radius:5px;display:inline-block}
/* one black + a hairline for every surface. no coloured edges, ever. */
.panel{position:absolute;background:#0B100F;border:1px solid rgba(176,228,204,.14);
  border-radius:10px;box-shadow:0 20px 48px rgba(0,0,0,.6)}
.rule{position:absolute;background:var(--emerald);height:2px}

  </style>

  <div id="root" data-composition-id="13-thread" data-start="0" data-width="1920" data-height="1080">

    <div class="plate" style="background-image:url('assets/plates/inspection.jpg');opacity:0.26"></div>
  <div class="scrim" style="background:radial-gradient(80% 92% at 52% 34%, rgba(9,20,19,.24) 0%, rgba(9,20,19,.80) 60%, rgba(9,20,19,.94) 100%)"></div>
    <div id="stage" class="stage"><div class="inner">
      
      <div id="s-tag" class="tag" style="position:absolute;left:118px;top:112px">11 · THE MAIN THREAD</div>
      <div id="s-rule" class="rule" style="left:118px;top:150px;width:96px;transform-origin:0% 50%"></div>

      <div id="s-lead" class="lead" style="position:absolute;left:120px;top:372px;width:840px;font-size:31px">Your handler, your framework and the browser share a single thread. A task over fifty milliseconds is a task the user's tap is queued behind.</div>

      <div id="t-lane1" style="position:absolute;left:158px;top:566px;width:1604px;height:66px;
        background:rgba(11,16,15,.86);border:1px solid rgba(176,228,204,.14);border-radius:8px"></div>
      <div id="t-l1lbl" class="mono" style="position:absolute;left:158px;top:534px;font-size:16px;letter-spacing:.15em;opacity:.6">ONE LONG TASK</div>
      <div id="t-tasks1" style="position:absolute;left:162px;top:570px;width:1596px;height:58px"></div>
      <div id="t-in1" style="position:absolute;left:566px;top:548px;width:3px;height:102px;background:var(--mint)"></div>
      <div id="t-in1lbl" class="mono" style="position:absolute;left:576px;top:648px;font-size:16px;color:var(--mint)">tap</div>

        border-left:2px solid var(--brass);border-right:2px solid var(--brass)"></div>
      <div id="t-waitlbl" class="mono hot" style="position:absolute;left:578px;top:692px;font-size:19px;font-weight:700">260ms queued behind it</div>

      <div id="t-lane2" style="position:absolute;left:158px;top:790px;width:1604px;height:66px;
        background:rgba(11,16,15,.86);border:1px solid rgba(176,228,204,.14);border-radius:8px"></div>
      <div id="t-l2lbl" class="mono" style="position:absolute;left:158px;top:758px;font-size:16px;letter-spacing:.15em;color:var(--emerald-lit);opacity:.8">THE SAME WORK, YIELDED</div>
      <div id="t-tasks2" style="position:absolute;left:162px;top:794px;width:1596px;height:58px"></div>

      <div id="t-code" class="mono" style="position:absolute;left:158px;top:936px;font-size:19px;color:var(--emerald-lit)">
        <span class="hot">await scheduler.yield()</span> &mdash; hand the lane back between chunks</div>

      <div id="t-lat" style="position:relative;position:absolute;left:1420px;top:756px;width:280px;text-align:right;height:56px;font-family:'JBMono',monospace;font-size:44px;font-weight:700;color:var(--mint)"><span id="t-lat-0" style="position:absolute;left:0;top:0;white-space:nowrap">260ms</span><span id="t-lat-1" style="position:absolute;left:0;top:0;white-space:nowrap">180ms</span><span id="t-lat-2" style="position:absolute;left:0;top:0;white-space:nowrap">96ms</span><span id="t-lat-3" style="position:absolute;left:0;top:0;white-space:nowrap">12ms</span></div>
      <div id="t-latlbl" class="mono" style="position:absolute;left:1420px;top:812px;width:280px;text-align:right;font-size:16px;letter-spacing:.14em;opacity:.55">INPUT LATENCY</div>
    </div></div>
  </div>

  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      // SEAM ENTRY — across, cut-the-curve LEFT. Enters mid-flight at full opacity:
      // the gate measures MOTION, so a frame that fades up still enters visibly blank.
      tl.fromTo("#stage", { x: 300 }, { x: 0, duration: 0.43, ease: "power4.out" }, 0);
      // SEAM CARRIER — the box tag and the headline are at FULL opacity from frame zero
      // and ride the cut in on the stage. They are never faded up: the seam gate measures
      // MOTION, so a station whose content fades in at 0.1s passes the gate while visibly
      // entering on an empty frame. Only the rule and the lead line are staged.
      tl.fromTo("#s-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.50, ease: "power3.out" }, 0.14);
      tl.fromTo("#s-hdr",  { y: 14 }, { y: 0, duration: 0.52, ease: "power3.out" }, 0);
      tl.fromTo("#s-lead", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.52, ease: "power3.out" }, 0.30000000000000004);
      tl.fromTo("#t-lane1", { autoAlpha: 0, scaleX: 0.96 }, { autoAlpha: 1, scaleX: 1, duration: 0.50, ease: "power3.out" }, 0.10);
      tl.fromTo("#t-l1lbl", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.34 }, 0.22);
      // the long task fills the lane in real time — you watch the block happen.
      var t1 = document.querySelector("#t-tasks1"), blk = document.createElement("div");
      blk.style.cssText = "position:absolute;left:0;top:0;width:" + (380*3.4) + "px;height:58px;border-radius:5px;" +
        "transform-origin:0% 50%;background:rgba(232,161,60,.8)";
      blk.innerHTML = '<span style="position:absolute;left:16px;top:18px;font-family:JBMono,monospace;font-size:19px;' +
        'font-weight:700;color:#1A1206">renderList()  380ms</span>';
      t1.appendChild(blk);
      tl.fromTo(blk, { scaleX: 0 }, { scaleX: 1, duration: 1.30, ease: "none" }, 0.60);
      // the tap lands mid-task and can do nothing at all.
      tl.fromTo("#t-in1",    { autoAlpha: 0, scaleY: 0 }, { autoAlpha: 1, scaleY: 1, duration: 0.24, ease: "back.out(2)" }, 1.02);
      tl.fromTo("#t-in1lbl", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.24 }, 1.10);
      gsap.set("#t-wait", { scaleX: 0 });
      tl.to("#t-wait", { scaleX: 1, duration: 0.90, ease: "none" }, 1.10);
      tl.fromTo("#t-waitlbl", { autoAlpha: 0, x: -12 }, { autoAlpha: 1, x: 0, duration: 0.36, ease: "power3.out" }, 2.02);
      // the same work, chunked. Five short tasks, and a gap the tap can land in.
      tl.fromTo("#t-lane2", { autoAlpha: 0, scaleX: 0.96 }, { autoAlpha: 1, scaleX: 1, duration: 0.50, ease: "power3.out" }, 3.00);
      tl.fromTo("#t-l2lbl", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.34 }, 3.10);
      var t2 = document.querySelector("#t-tasks2"), x = 0;
      for (var i = 0; i < 5; i++) {
        var c = document.createElement("div"), w = 76*3.4;
        c.style.cssText = "position:absolute;left:" + x + "px;top:0;width:" + w + "px;height:58px;border-radius:5px;" +
          "transform-origin:0% 50%;background:rgba(64,138,113,.86)";
        t2.appendChild(c); x += w + 18;
        tl.fromTo(c, { scaleX: 0 }, { scaleX: 1, duration: 0.26, ease: "none" }, 3.40 + i*0.30);
      }
      tl.fromTo("#t-in2", { autoAlpha: 0, scaleY: 0 }, { autoAlpha: 1, scaleY: 1, duration: 0.24, ease: "back.out(2)" }, 4.10);
      tl.fromTo("#t-ok",  { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.36, ease: "power3.out" }, 4.90);
      tl.fromTo("#t-code",{ autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.42, ease: "power3.out" }, 5.30);
      // the yielded lane keeps taking taps — three more land instantly, so the beat's
      // last four seconds are still demonstrating the fix rather than displaying it.
      tl.fromTo("#t-latlbl", { autoAlpha: 0 }, { autoAlpha: 0.55, duration: 0.36 }, 6.10);
      for (var _r = 0; _r < 4; _r++) gsap.set("#t-lat-" + _r, { autoAlpha: 0 });
      tl.set("#t-lat-0", { autoAlpha: 1 }, 6.10);
      tl.set("#t-lat-1", { autoAlpha: 1 }, 6.72);
      tl.set("#t-lat-0", { autoAlpha: 0 }, 6.72);
      tl.set("#t-lat-2", { autoAlpha: 1 }, 7.34);
      tl.set("#t-lat-1", { autoAlpha: 0 }, 7.34);
      tl.set("#t-lat-3", { autoAlpha: 1 }, 7.96);
      tl.set("#t-lat-2", { autoAlpha: 0 }, 7.96);
      for (var v2 = 0; v2 < 3; v2++) {
        var tt = 7.00 + v2*0.94;
        tl.to("#t-in2", { x: v2*116 + 60, duration: 0.30, ease: "power3.out" }, tt);
        tl.fromTo("#t-in2", { autoAlpha: 1 }, { autoAlpha: 0.35, duration: 0.16, yoyo: true, repeat: 1 }, tt + 0.30);
        tl.fromTo(t2.children[v2 + 1], { scaleY: 1 }, { scaleY: 1.16, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out" }, tt + 0.32);
      }
      // SEAM EXIT — across, travelling LEFT out of frame at matched velocity.
      tl.to("#stage", { x: -236, duration: 0.34, ease: "power4.in" }, 10.37);
      window.__timelines = window.__timelines || {};
      window.__timelines["13-thread"] = tl;
    })();
  </script>

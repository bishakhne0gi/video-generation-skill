<template>
  <style>
@font-face{font-family:"Archivo";src:url("assets/fonts/Archivo-var.woff2") format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:block}
@font-face{font-family:"JBMono";src:url("assets/fonts/JetBrainsMono-400.woff2") format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"JBMono";src:url("assets/fonts/JetBrainsMono-700.woff2") format("woff2");font-weight:700;font-display:block}
@font-face{font-family:"Instrument";src:url("assets/fonts/InstrumentSerif-italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:block}

#root{position:relative;width:1920px;height:1080px;overflow:hidden;
  --void:#091413; --forest:#285A48; --emerald:#408A71; --emerald-lit:#6FD0AA;
  --mint:#B0E4CC; --brass:#E8A13C; --ink:#091413;
  background:var(--void); font-family:"Archivo",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;}
#root *{margin:0;padding:0;box-sizing:border-box}

/* ---- the field: one plate per act, dimmed, never absent ---- */
.plate{position:absolute;inset:0;background-size:cover;background-position:center}
.scrim{position:absolute;inset:0}
/* stage carries every seam move; content never animates the clip itself */
.stage{position:absolute;inset:0}
.inner{position:relative;z-index:1;width:100%;height:100%}

/* ---- MATERIAL: bezel -> face -> glass. All lighting static. ---- */
.bezel{position:absolute;background-image:url("assets/plates/brass.jpg");
  background-size:cover;background-position:center;
  box-shadow:inset 2px 2px 5px rgba(255,236,196,.55), inset -3px -3px 7px rgba(0,0,0,.62),
             0 18px 44px rgba(0,0,0,.62), 0 2px 0 rgba(255,236,196,.14)}
.face{position:absolute;background:
   radial-gradient(120% 120% at 32% 22%, #2E6551 0%, #16302A 46%, #091413 100%);
  box-shadow:inset 0 8px 26px rgba(0,0,0,.66), inset 0 -2px 0 rgba(255,255,255,.05)}
/* .glasscap is the DOME photograph and belongs to ROUND instruments only. Laid over a
   rectangular case it reads as a dark ellipse floating on the content. Flat covers get
   .glassflat: a sheen, not a photograph. */
.glasscap{position:absolute;pointer-events:none;
  background-image:url("assets/plates/glass.jpg");background-size:cover;background-position:center;
  mix-blend-mode:screen;opacity:.20}
.glassflat{position:absolute;pointer-events:none;background:
  linear-gradient(176deg, rgba(176,228,204,.09) 0%, rgba(176,228,204,.02) 18%,
                  rgba(255,255,255,0) 46%, rgba(9,20,19,.16) 100%);
  box-shadow:inset 0 1px 0 rgba(176,228,204,.20)}
.spec{position:absolute;pointer-events:none;background:
  linear-gradient(107deg, rgba(255,255,255,0) 34%, rgba(255,255,255,.07) 46%,
                  rgba(255,255,255,.02) 53%, rgba(255,255,255,0) 62%)}
.leather{background-image:url("assets/plates/leather.jpg");background-size:cover;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08), 0 16px 40px rgba(0,0,0,.55)}

/* the needle — the film's signature. transform-origin at the pivot. */
.needle{position:absolute;transform-origin:50% 100%;
  background:linear-gradient(180deg,var(--mint) 0%, #7FC4A6 62%, #33604F 100%);
  box-shadow:0 0 12px rgba(176,228,204,.36), 0 2px 5px rgba(0,0,0,.6);border-radius:2px}
.needle.hot{background:linear-gradient(180deg,var(--brass) 0%, #C07C22 70%, #4A3210 100%);
  box-shadow:0 0 16px rgba(232,161,60,.44), 0 2px 5px rgba(0,0,0,.6)}
.hub{position:absolute;border-radius:50%;background-image:url("assets/plates/brass.jpg");
  background-size:cover;box-shadow:inset 1px 1px 3px rgba(255,236,196,.6),
  inset -2px -2px 4px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.7)}

/* ---- TYPE ---- */
.hdr{font-weight:800;font-stretch:125%;letter-spacing:-.04em;color:var(--mint);line-height:.94}
.lead{font-weight:400;color:var(--mint);opacity:.86;line-height:1.28}
.mono{font-family:"JBMono",monospace;color:var(--emerald-lit)}
.tag{font-family:"JBMono",monospace;font-weight:700;letter-spacing:.18em;
  color:var(--emerald-lit);font-size:21px}
.hot{color:var(--brass)}
.chipmint{background:var(--mint);color:var(--ink);font-family:"JBMono",monospace;
  font-weight:700;border-radius:5px;display:inline-block}
/* one black + a hairline for every surface. no coloured edges, ever. */
.panel{position:absolute;background:#0B100F;border:1px solid rgba(176,228,204,.14);
  border-radius:10px;box-shadow:0 20px 48px rgba(0,0,0,.6)}
.rule{position:absolute;background:var(--emerald);height:2px}

  </style>

  <div id="root" data-composition-id="14-paint" data-start="0" data-width="1920" data-height="1080">

    <div class="plate" style="background-image:url('assets/plates/inspection.jpg');opacity:0.26"></div>
  <div class="scrim" style="background:radial-gradient(80% 92% at 52% 34%, rgba(9,20,19,.24) 0%, rgba(9,20,19,.80) 60%, rgba(9,20,19,.94) 100%)"></div>
    <div id="stage" class="stage"><div class="inner">
      
      <div id="s-tag" class="tag" style="position:absolute;left:118px;top:112px">12 · LAYOUT AND PAINT</div>
      <div id="s-rule" class="rule" style="left:118px;top:150px;width:96px;transform-origin:0% 50%"></div>
      <div id="s-hdr" class="hdr" style="position:absolute;left:118px;top:176px;width:1180px;font-size:82px">Four stages.<br>Skip three.</div>
      <div id="s-lead" class="lead" style="position:absolute;left:120px;top:372px;width:840px;font-size:31px">Reading a layout value after writing one forces the browser to run the whole chain, synchronously, inside your loop. Transform and opacity never touch it.</div>

      <div id="v-pipe" style="position:absolute;left:158px;top:552px;width:1604px;height:104px"></div>

      <div id="v-bad" style="position:absolute;left:158px;top:706px;width:770px">
        <div class="mono hot" style="font-size:17px;letter-spacing:.15em">LAYOUT THRASH &mdash; 40 FORCED REFLOWS</div>
        <div class="panel" style="position:relative;left:0;top:16px;width:770px;height:184px;background:#080C0B">
          <div class="mono" style="position:absolute;left:22px;top:22px;font-size:19px;line-height:1.8;color:var(--emerald-lit)">
            <span style="opacity:.55">for (const el of items) {</span><br>
            &nbsp;&nbsp;el.style.height = h + <span style="color:var(--mint)">"px"</span>;<span style="opacity:.45"> // write</span><br>
            &nbsp;&nbsp;h = el.<span class="hot">offsetHeight</span>;<span style="opacity:.45"> // read &rarr; forced reflow</span><br>
            <span style="opacity:.55">}</span></div></div></div>

      <div id="v-good" style="position:absolute;left:992px;top:706px;width:770px">
        <div class="mono" style="font-size:17px;letter-spacing:.15em;color:var(--emerald-lit)">COMPOSITOR ONLY &mdash; NO LAYOUT AT ALL</div>
        <div class="panel" style="position:relative;left:0;top:16px;width:770px;height:184px;background:#080C0B">
          <div class="mono" style="position:absolute;left:22px;top:22px;font-size:19px;line-height:1.8;color:var(--emerald-lit)">
            el.style.<span style="color:var(--mint)">transform</span> = <span style="color:var(--mint)">"translateY(8px)"</span>;<br>
            el.style.<span style="color:var(--mint)">opacity</span> = <span style="color:var(--mint)">".4"</span>;<br>
            <span style="opacity:.45">// straight to the compositor</span><br>
            <span style="opacity:.45">// content-visibility / contain help too</span></div></div></div>

      <div id="v-fps" style="position:relative;position:absolute;left:1462px;top:462px;width:300px;text-align:right;height:60px;font-family:'JBMono',monospace;font-size:46px;font-weight:700;color:var(--mint)"><span id="v-fps-0" style="position:absolute;left:0;top:0;white-space:nowrap">24 fps</span><span id="v-fps-1" style="position:absolute;left:0;top:0;white-space:nowrap">38 fps</span><span id="v-fps-2" style="position:absolute;left:0;top:0;white-space:nowrap">52 fps</span><span id="v-fps-3" style="position:absolute;left:0;top:0;white-space:nowrap">60 fps</span></div>
      <div id="v-fpslbl" class="mono" style="position:absolute;left:1462px;top:524px;width:300px;text-align:right;font-size:16px;letter-spacing:.14em;opacity:.55">FRAME RATE WHILE SCROLLING</div>
    </div></div>
  </div>

  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      // SEAM ENTRY — across, cut-the-curve LEFT. Enters mid-flight at full opacity:
      // the gate measures MOTION, so a frame that fades up still enters visibly blank.
      tl.fromTo("#stage", { x: 300 }, { x: 0, duration: 0.43, ease: "power4.out" }, 0);
      // SEAM CARRIER — the box tag and the headline are at FULL opacity from frame zero
      // and ride the cut in on the stage. They are never faded up: the seam gate measures
      // MOTION, so a station whose content fades in at 0.1s passes the gate while visibly
      // entering on an empty frame. Only the rule and the lead line are staged.
      tl.fromTo("#s-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.50, ease: "power3.out" }, 0.14);
      tl.fromTo("#s-hdr",  { y: 14 }, { y: 0, duration: 0.52, ease: "power3.out" }, 0);
      tl.fromTo("#s-lead", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.52, ease: "power3.out" }, 0.30000000000000004);
      // the pipeline itself, built as four physical stations with a belt between them.
      var S = ["STYLE","LAYOUT","PAINT","COMPOSITE"], pipe = document.querySelector("#v-pipe"), boxes = [];
      for (var i = 0; i < 4; i++) {
        var b = document.createElement("div");
        b.style.cssText = "position:absolute;left:" + (i*412) + "px;top:0;width:344px;height:104px;border-radius:10px;" +
          "background:rgba(11,16,15,.9);border:1px solid rgba(176,228,204,.18);display:flex;align-items:center;justify-content:center";
        b.innerHTML = '<span style="font-family:JBMono,monospace;font-size:24px;font-weight:700;letter-spacing:.14em;' +
          'color:var(--emerald-lit)">' + S[i] + '</span>';
        pipe.appendChild(b); boxes.push(b);
        if (i < 3) {
          var arrow = document.createElement("div");
          arrow.className = "arr";
          arrow.style.cssText = "position:absolute;left:" + (i*412 + 344) + "px;top:50px;width:68px;height:3px;" +
            "transform-origin:0% 50%;background:rgba(176,228,204,.35)";
          pipe.appendChild(arrow);
          tl.fromTo(arrow, { scaleX: 0 }, { scaleX: 1, duration: 0.28, ease: "power3.out" }, 0.44 + i*0.20);
        }
        tl.fromTo(b, { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.42, ease: "power3.out" }, 0.24 + i*0.20);
      }
      tl.fromTo("#v-bad",  { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.50, ease: "power3.out" }, 1.50);
      tl.fromTo("#v-good", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.50, ease: "power3.out" }, 3.10);
      // the thrash: the whole chain lights, over and over, once per item. It repeats for
      // the rest of the beat because that is exactly what the loop does.
      for (var r = 0; r < 5; r++) {
        for (var s = 0; s < 4; s++) {
          tl.to(boxes[s], { backgroundColor: "rgba(232,161,60,0.80)", duration: 0.10, ease: "none" }, 2.10 + r*0.62 + s*0.07);
          tl.to(boxes[s], { backgroundColor: "rgba(11,16,15,0.90)", duration: 0.22, ease: "none" }, 2.24 + r*0.62 + s*0.07);
        }
      }
      // then the honest contrast: only the last stage runs, and it keeps running.
      for (var q = 0; q < 6; q++) {
        tl.to(boxes[3], { backgroundColor: "rgba(176,228,204,0.72)", duration: 0.10, ease: "none" }, 5.40 + q*0.44);
        tl.to(boxes[3], { backgroundColor: "rgba(11,16,15,0.90)", duration: 0.24, ease: "none" }, 5.54 + q*0.44);
      }
      // the frame rate is the reason any of this matters, and it resolves last.
      tl.fromTo("#v-fpslbl", { autoAlpha: 0 }, { autoAlpha: 0.55, duration: 0.36 }, 6.20);
      for (var _r = 0; _r < 4; _r++) gsap.set("#v-fps-" + _r, { autoAlpha: 0 });
      tl.set("#v-fps-0", { autoAlpha: 1 }, 6.20);
      tl.set("#v-fps-1", { autoAlpha: 1 }, 6.86);
      tl.set("#v-fps-0", { autoAlpha: 0 }, 6.86);
      tl.set("#v-fps-2", { autoAlpha: 1 }, 7.52);
      tl.set("#v-fps-1", { autoAlpha: 0 }, 7.52);
      tl.set("#v-fps-3", { autoAlpha: 1 }, 8.18);
      tl.set("#v-fps-2", { autoAlpha: 0 }, 8.18);
      // the compositor keeps ticking on its own to the cut: one stage, doing all the work.
      for (var w2 = 0; w2 < 5; w2++) {
        tl.to(boxes[3], { backgroundColor: "rgba(176,228,204,0.72)", duration: 0.09, ease: "none" }, 8.10 + w2*0.40);
        tl.to(boxes[3], { backgroundColor: "rgba(11,16,15,0.90)", duration: 0.22, ease: "none" }, 8.22 + w2*0.40);
      }
      // SEAM EXIT — ACT BREAK lift. Travels UP and pulls back to 0.84.
      tl.to("#stage", { y: -300, duration: 0.46, ease: "power4.in" }, 10.97);
      tl.to("#stage", { scale: 0.84, duration: 0.52, ease: "power2.in" }, 10.97);
      window.__timelines = window.__timelines || {};
      window.__timelines["14-paint"] = tl;
    })();
  </script>

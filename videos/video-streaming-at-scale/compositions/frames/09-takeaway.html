    (function () {
      var tl = gsap.timeline({ paused: true });

      gsap.set(["#f9-i1", "#f9-i2", "#f9-i3", "#f9-sign", "#f9-next"], { autoAlpha: 0 });

      // ---- SEAM 8 -> 9 ENTRY: UP. Frame 08 exited travelling up at -206 on power4.in;

      // from t=0 — the frame rides its own cut rather than fading up behind it.
      tl.fromTo("#f9-stage", { y: 262 }, { y: 0, duration: 0.43, ease: "power4.out" }, 0);

      // the wind, one last time, slowest of the film — the picture settling.
      tl.fromTo("#f9-wind", { xPercent: 0.5, scale: 1.02 },

      // Scene 2 (1.0-4.6s): the four mechanisms land, 420ms apart. Nothing arrives as a
      // group; the cascade is what makes four lines read as a list rather than a slide.
      tl.to(["#f9-i1", "#f9-i2", "#f9-i3"], { autoAlpha: 1, duration: 0.4, ease: "power3.out", stagger: 0.42 }, 1.42);
      tl.fromTo(["#f9-i1", "#f9-i2", "#f9-i3"], { x: 44 }, { x: 0, duration: 0.5, ease: "power3.out", stagger: 0.42 }, 1.42);

      // Scene 4 (6.0-9.5s): the next-episode card rises, then the film holds still and
      // golden for 2.4s. It ends at rest, and the bed carries it out.
      tl.to("#f9-next", { autoAlpha: 1, duration: 0.5, ease: "power3.out" }, 6.0);
      tl.fromTo("#f9-next", { y: 30 }, { y: 0, duration: 0.56, ease: "power3.out" }, 6.0);
